name: CI

on:
  push:
    branches: [main, master, '3.0.0']
  pull_request:
    branches: [main, master, '3.0.0']

jobs:
  php-lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      - name: Check PHP syntax
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -P4 php -l

  wpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Errors block the build. Warnings are reported but allowed, which
      # matches what the pre-commit hook gates on.
      - name: PHPCS (errors block, warnings advisory)
        run: vendor/bin/phpcs --error-severity=1 --warning-severity=0 --report=full

      - name: PHPCS warning report (advisory)
        if: always()
        run: vendor/bin/phpcs --error-severity=0 --warning-severity=1 --report=summary || true

  phpstan:
    name: PHPStan (level 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  phpunit:
    name: Functional (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
        wp: ['6.5', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer

      # install-wp-tests.sh uses svn export; Ubuntu runners lack subversion.
      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true

      # The shortcodes are BuddyPress-dependent, so functional coverage is
      # meaningless without it. Fetch the matching BuddyPress into the
      # plugins dir the test bootstrap looks in.
      - name: Install BuddyPress into the test plugins directory
        run: |
          BP_DIR="${WP_CORE_DIR:-/tmp/wordpress}/wp-content/plugins"
          mkdir -p "$BP_DIR"
          curl -sSL https://downloads.wordpress.org/plugin/buddypress.latest-stable.zip -o /tmp/bp.zip
          unzip -q -o /tmp/bp.zip -d "$BP_DIR"
          ln -sfn "$BP_DIR/buddypress" "$(dirname "$GITHUB_WORKSPACE")/buddypress" || true
          ls -d "$BP_DIR/buddypress"

      - name: Run functional tests
        run: vendor/bin/phpunit --testsuite functional

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          path: shortcodes-for-buddypress

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: wp-cli

      - name: Install WordPress
        run: |
          wp core download --path=/tmp/wp --quiet
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root \
            --dbpass=root --dbhost=127.0.0.1:3306 --quiet
          wp core install --path=/tmp/wp --url=http://localhost \
            --title=CI --admin_user=admin --admin_password=admin \
            --admin_email=ci@example.com --skip-email --quiet
          cp -r shortcodes-for-buddypress /tmp/wp/wp-content/plugins/

      - name: Run Plugin Check
        run: |
          wp plugin install plugin-check --activate --path=/tmp/wp --quiet
          set +e
          RESULT=$(wp plugin check shortcodes-for-buddypress --path=/tmp/wp --format=csv 2>&1)
          set -e
          echo "$RESULT"

          # Dev-only files are not distributed (see gruntfile packaging
          # excludes), so their findings are noise here.
          NOISE='compressed_files|hidden_files|application_detected|missing_direct_file_access_protection|outdated_tested_upto_header'
          CODE_ERRORS=$(echo "$RESULT" | awk -F',' -v noise="$NOISE" '
            $0 ~ /ERROR/ {
              if ($1 ~ /^tests\//) next
              if ($1 ~ /^bin\//) next
              if ($1 ~ /^audit\//) next
              if ($0 ~ noise) next
              count++
            }
            END { print count+0 }
          ')
          echo "Blocking Plugin Check errors: $CODE_ERRORS"
          test "$CODE_ERRORS" -eq 0
